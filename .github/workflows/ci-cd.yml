# ════════════════════════════════════════════════════════════════
# Unified CI/CD — DevTools Installer Monorepo
# ════════════════════════════════════════════════════════════════
#
# Branch strategy & what runs where:
#
#  Branch          │ Desktop changed │ Webapp changed
#  ────────────────┼─────────────────┼──────────────────────────
#  feature/* / PR  │ build only      │ nothing
#  develop          │ build + sign    │ deploy (latest release URL)
#  main            │ build + sign    │ auto-create release
#                  │ + release       │ + deploy (new release URL)
#
# Job dependency graph:
#   changes ──► build-desktop ──► create-release (main only)
#                    │                   │
#                    └───────────────────┴──► deploy-website (develop/main)
#
# ════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────
# JOB 1 — Detect which paths changed
# ────────────────────────────────────────────────────────────────
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'desktopapp/**'
            webapp:
              - 'webapp/**'
              - 'firebase.json'
              - '.firebaserc'
              - 'desktopapp/**'   # webapp redeploys when desktop cuts a new release

# ────────────────────────────────────────────────────────────────
# JOB 2 — Build & Sign the Windows installer
#
# Runs on:    all branches, when desktopapp/ changed
# Signing:    develop and main only (skipped on feature branches)
# ────────────────────────────────────────────────────────────────
  build-desktop:
    name: Build Desktop App
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      filename: ${{ steps.version.outputs.filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content "desktopapp/package.json" -Raw | ConvertFrom-Json
          $version = $pkg.version
          $filename = "DevTools-Installer-Setup-${version}.exe"
          Write-Host "Version: $version | Filename: $filename"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "filename=$filename" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktopapp/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktopapp/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        working-directory: desktopapp
        run: npm ci

      - name: Ensure build/icon.ico exists
        shell: pwsh
        working-directory: desktopapp
        run: |
          if (-Not (Test-Path "build/icon.ico")) {
            New-Item -ItemType Directory -Force -Path "build" | Out-Null
            magick -size 256x256 xc:"#4f8cff" `
              -define icon:auto-resize="256,128,64,48,32,16" `
              build/icon.ico
            if (-Not (Test-Path "build/icon.ico")) { throw "Failed to generate icon.ico" }
          }

      - name: Build installer
        working-directory: desktopapp
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          $exe = Get-ChildItem -Path "dist/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in dist/" }
          Write-Host "Built: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"

      # ── Signing: develop and main only ─────────────────────────
      - name: Sign installer
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        shell: pwsh
        working-directory: desktopapp
        env:
          CERT_PASSWORD: ${{ secrets.SELF_SIGN_CERT_PASSWORD }}
        run: |
          $exe = (Get-ChildItem -Path "dist/*.exe" | Select-Object -First 1).FullName
          Write-Host "Signing: $exe"

          $pfxPath = "$env:RUNNER_TEMP\signing-cert.pfx"
          $certPassword = if ($env:CERT_PASSWORD) { $env:CERT_PASSWORD } else { "DevToolsInstaller2024!" }
          $securePwd = ConvertTo-SecureString -String $certPassword -Force -AsPlainText

          if ("${{ secrets.WIN_CSC_LINK }}" -ne "") {
            # Use a real certificate from repository secrets
            Write-Host "Using certificate from WIN_CSC_LINK secret"
            $pfxBytes = [Convert]::FromBase64String("${{ secrets.WIN_CSC_LINK }}")
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          } else {
            # Generate a self-signed certificate (development/staging use)
            Write-Host "Generating self-signed certificate"
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=DevTools Installer, O=DevTools" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -NotAfter (Get-Date).AddYears(3) `
              -CertStoreLocation Cert:\CurrentUser\My `
              -HashAlgorithm SHA256
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePwd | Out-Null
          }

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" -Recurse |
            Sort-Object { $_.Directory.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on runner" }

          & $signtool.FullName sign `
            /f $pfxPath /p $certPassword `
            /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            /v $exe

          if ($LASTEXITCODE -ne 0) { throw "Signing failed with exit code $LASTEXITCODE" }

          # Verify the signature (Get-AuthenticodeSignature works for self-signed certs;
          # signtool verify /pa does not — it requires a trusted root CA)
          $sig = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Signature status: $($sig.Status)"
          if (-not $sig.SignerCertificate) { throw "Signing failed — no certificate on file" }

          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          Write-Host "Signing complete"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevTools-Installer-Windows
          path: |
            desktopapp/dist/*.exe
            desktopapp/dist/*.blockmap
            desktopapp/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

# ────────────────────────────────────────────────────────────────
# JOB 3 — Auto-create GitHub Release
#
# Runs on:  main branch only, when desktopapp/ changed
# Purpose:  Triggered automatically when develop is merged into main.
#           Tags the commit as v{version} and publishes the release.
# ────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [changes, build-desktop]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.desktop == 'true' &&
      needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.release-url.outputs.download_url }}
      tag: ${{ steps.release-url.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DevTools-Installer-Windows
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-desktop.outputs.version }}"
          name: "DevTools Installer v${{ needs.build-desktop.outputs.version }}"
          draft: false
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.blockmap
            release-assets/**/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output download URL
        id: release-url
        run: |
          TAG="v${{ needs.build-desktop.outputs.version }}"
          FILENAME="${{ needs.build-desktop.outputs.filename }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          echo "download_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release download URL: ${URL}"

# ────────────────────────────────────────────────────────────────
# JOB 4 — Deploy Website to Firebase Hosting
#
# Runs on:  develop and main, when webapp/ or desktopapp/ changed
# develop:   fetches the latest existing release URL
# main:     uses the URL from the release just created in Job 3
# ────────────────────────────────────────────────────────────────
  deploy-website:
    name: Deploy Website
    needs: [changes, build-desktop, create-release]
    if: |
      always() &&
      !failure() && !cancelled() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Resolve release info
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If a release was created in this run (main branch), use it directly.
          # Otherwise (develop branch), fetch the latest published release.
          if [[ "${{ needs.create-release.result }}" == "success" ]]; then
            VERSION="${{ needs.build-desktop.outputs.version }}"
            FILENAME="${{ needs.build-desktop.outputs.filename }}"
            DOWNLOAD_URL="${{ needs.create-release.outputs.download_url }}"
            echo "Using newly created release: v${VERSION}"
          else
            RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/latest" 2>/dev/null || echo "{}")
            TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // ""')

            if [[ -n "$TAG" && "$TAG" =~ ^v[0-9] ]]; then
              VERSION="${TAG#v}"
              FILENAME="DevTools-Installer-Setup-${VERSION}.exe"
              DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
              echo "Using latest existing release: ${TAG}"
            else
              # No release published yet — link to the releases page
              VERSION="1.0.0"
              FILENAME="DevTools-Installer-Setup-${VERSION}.exe"
              DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases"
              echo "No release found — linking to releases page"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "  Version:  ${VERSION}"
          echo "  URL:      ${DOWNLOAD_URL}"

      - name: Build website
        working-directory: webapp
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.version }}
          VITE_DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          VITE_INSTALLER_FILENAME: ${{ steps.release.outputs.filename }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
