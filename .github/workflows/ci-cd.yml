# ════════════════════════════════════════════════════════════════
# Unified CI/CD — DevTools Installer Monorepo
# ════════════════════════════════════════════════════════════════
#
# Branch strategy & what runs where:
#
#  Branch          │ Desktop changed                           │ Webapp changed
#  ────────────────┼───────────────────────────────────────────┼──────────────────
#  feature/* / PR  │ build only                                │ nothing
#  develop / main  │ version bump → build + sign → upload      │ deploy website
#                  │   → cleanup (keep latest 3 versions)      │
#
# Job dependency graph:
#   changes ──► version-bump ──► build-desktop ──► upload-to-storage ──► cleanup-storage
#                                      │                  │
#                                      └──────────────────┴──► deploy-website
#
# ════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────
# JOB 1 — Detect which paths changed
# ────────────────────────────────────────────────────────────────
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'desktopapp/**'
            webapp:
              - 'webapp/**'
              - 'firebase.json'
              - '.firebaserc'
              - 'desktopapp/**'   # webapp redeploys when desktop builds a new version

# ────────────────────────────────────────────────────────────────
# JOB 2 — Auto-bump version based on conventional commits
#
# Runs on:  develop and main, when desktopapp/ changed
# Convention:
#   feat:  → minor bump   (e.g. 1.0.0 → 1.1.0)
#   fix:   → patch bump   (e.g. 1.0.0 → 1.0.1)
#   BREAKING CHANGE / feat!: / fix!:  → major bump
#   anything else → patch bump
# ────────────────────────────────────────────────────────────────
  version-bump:
    name: Version Bump
    needs: changes
    if: |
      needs.changes.outputs.desktop == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      filename: ${{ steps.bump.outputs.filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump from commit messages
        id: bump
        run: |
          # Get commit messages since last version tag (or all if no tags)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" -- desktopapp/)
          else
            COMMITS=$(git log --pretty=format:"%s" -- desktopapp/)
          fi

          echo "Commits since last tag:"
          echo "$COMMITS"

          # Determine bump type from conventional commit messages
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^(feat|fix)(\(.+\))?!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi

          echo "Determined bump type: $BUMP"

          # Read current version
          CURRENT=$(jq -r '.version' desktopapp/package.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          FILENAME="DevTools-Installer-Setup-${NEW_VERSION}.exe"

          echo "Version: $CURRENT → $NEW_VERSION ($BUMP)"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"

          # Update package.json
          jq --arg v "$NEW_VERSION" '.version = $v' desktopapp/package.json > tmp.json
          mv tmp.json desktopapp/package.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add desktopapp/package.json
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
            git push
          fi

# ────────────────────────────────────────────────────────────────
# JOB 3 — Build & Sign the Windows installer
#
# Runs on:    all branches, when desktopapp/ changed
# Signing:    develop and main only (skipped on feature branches)
# ────────────────────────────────────────────────────────────────
  build-desktop:
    name: Build Desktop App
    needs: [changes, version-bump]
    if: |
      always() &&
      needs.changes.outputs.desktop == 'true' &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      filename: ${{ steps.version.outputs.filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          # Pull latest in case version-bump just pushed
          git pull --ff-only origin ${{ github.ref_name }} 2>$null
          $pkg = Get-Content "desktopapp/package.json" -Raw | ConvertFrom-Json
          $version = $pkg.version
          $filename = "DevTools-Installer-Setup-${version}.exe"
          Write-Host "Version: $version | Filename: $filename"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "filename=$filename" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktopapp/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktopapp/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        working-directory: desktopapp
        run: npm ci

      - name: Ensure build/icon.ico exists
        shell: pwsh
        working-directory: desktopapp
        run: |
          if (-Not (Test-Path "build/icon.ico")) {
            New-Item -ItemType Directory -Force -Path "build" | Out-Null
            magick -size 256x256 xc:"#4f8cff" `
              -define icon:auto-resize="256,128,64,48,32,16" `
              build/icon.ico
            if (-Not (Test-Path "build/icon.ico")) { throw "Failed to generate icon.ico" }
          }

      - name: Build installer
        working-directory: desktopapp
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          $exe = Get-ChildItem -Path "dist/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in dist/" }
          Write-Host "Built: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"

      # ── Signing: develop and main only ─────────────────────────
      - name: Sign installer
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        shell: pwsh
        working-directory: desktopapp
        env:
          CERT_PASSWORD: ${{ secrets.SELF_SIGN_CERT_PASSWORD }}
        run: |
          $exe = (Get-ChildItem -Path "dist/*.exe" | Select-Object -First 1).FullName
          Write-Host "Signing: $exe"

          $pfxPath = "$env:RUNNER_TEMP\signing-cert.pfx"
          $certPassword = if ($env:CERT_PASSWORD) { $env:CERT_PASSWORD } else { "DevToolsInstaller2024!" }
          $securePwd = ConvertTo-SecureString -String $certPassword -Force -AsPlainText

          if ("${{ secrets.WIN_CSC_LINK }}" -ne "") {
            # Use a real certificate from repository secrets
            Write-Host "Using certificate from WIN_CSC_LINK secret"
            $pfxBytes = [Convert]::FromBase64String("${{ secrets.WIN_CSC_LINK }}")
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          } else {
            # Generate a self-signed certificate (development/staging use)
            Write-Host "Generating self-signed certificate"
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=DevTools Installer, O=DevTools" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -NotAfter (Get-Date).AddYears(3) `
              -CertStoreLocation Cert:\CurrentUser\My `
              -HashAlgorithm SHA256
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePwd | Out-Null
          }

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" -Recurse |
            Sort-Object { $_.Directory.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on runner" }

          & $signtool.FullName sign `
            /f $pfxPath /p $certPassword `
            /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            /v $exe

          if ($LASTEXITCODE -ne 0) { throw "Signing failed with exit code $LASTEXITCODE" }

          # Verify the signature (Get-AuthenticodeSignature works for self-signed certs;
          # signtool verify /pa does not — it requires a trusted root CA)
          $sig = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Signature status: $($sig.Status)"
          if (-not $sig.SignerCertificate) { throw "Signing failed — no certificate on file" }

          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          Write-Host "Signing complete"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevTools-Installer-Windows
          path: desktopapp/dist/*.exe
          if-no-files-found: error
          retention-days: 30

# ────────────────────────────────────────────────────────────────
# JOB 4 — Upload Installer to Firebase Storage
#
# Runs on:  develop and main, when desktopapp/ changed
# Uploads only the .exe to a versioned path in the bucket.
# ────────────────────────────────────────────────────────────────
  upload-to-storage:
    name: Upload to Firebase Storage
    needs: [changes, build-desktop]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.changes.outputs.desktop == 'true' &&
      needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.upload.outputs.download_url }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DevTools-Installer-Windows
          path: release-assets

      - name: Upload .exe to Firebase Storage
        id: upload
        run: |
          VERSION="${{ needs.build-desktop.outputs.version }}"
          FILENAME="${{ needs.build-desktop.outputs.filename }}"
          BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"

          EXE_PATH=$(find release-assets -name "*.exe" | head -1)
          if [[ -z "$EXE_PATH" ]]; then
            echo "::error::No .exe found in release-assets"
            exit 1
          fi

          echo "Uploading ${FILENAME} to gs://${BUCKET}/releases/v${VERSION}/"

          # Upload versioned copy
          gsutil -h "Content-Type:application/octet-stream" \
                 -h "Content-Disposition:attachment; filename=${FILENAME}" \
            cp -a public-read "$EXE_PATH" \
            "gs://${BUCKET}/releases/v${VERSION}/${FILENAME}"

          DOWNLOAD_URL="https://storage.googleapis.com/${BUCKET}/releases/v${VERSION}/${FILENAME}"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "Download URL: ${DOWNLOAD_URL}"

# ────────────────────────────────────────────────────────────────
# JOB 5 — Cleanup old versions in Firebase Storage
#
# Runs after successful upload. Keeps only the latest 3 versions.
# ────────────────────────────────────────────────────────────────
  cleanup-storage:
    name: Cleanup Old Versions
    needs: [upload-to-storage]
    if: needs.upload-to-storage.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Remove old versions (keep latest 3)
        run: |
          BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"

          echo "Listing version folders in gs://${BUCKET}/releases/..."

          # List all versioned directories (v1.0.0, v1.1.0, etc.)
          VERSIONS=$(gsutil ls "gs://${BUCKET}/releases/" 2>/dev/null \
            | grep -oP 'v\d+\.\d+\.\d+' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | uniq)

          COUNT=$(echo "$VERSIONS" | grep -c . || true)
          echo "Found $COUNT version(s): $VERSIONS"

          if [[ "$COUNT" -le 3 ]]; then
            echo "3 or fewer versions present — nothing to clean up."
            exit 0
          fi

          # Calculate how many to delete (keep the latest 3)
          DELETE_COUNT=$((COUNT - 3))
          TO_DELETE=$(echo "$VERSIONS" | head -n "$DELETE_COUNT")

          echo "Deleting $DELETE_COUNT old version(s):"
          for VER in $TO_DELETE; do
            echo "  Removing gs://${BUCKET}/releases/${VER}/"
            gsutil -m rm -r "gs://${BUCKET}/releases/${VER}/" || true
          done

          echo "Cleanup complete. Remaining versions:"
          gsutil ls "gs://${BUCKET}/releases/" 2>/dev/null | grep -oP 'v\d+\.\d+\.\d+' | sort -t. -k1,1n -k2,2n -k3,3n | uniq

# ────────────────────────────────────────────────────────────────
# JOB 6 — Deploy Website to Firebase Hosting
#
# Runs on:  develop and main, when webapp/ or desktopapp/ changed.
# Download URL points to the Firebase Storage .exe.
# ────────────────────────────────────────────────────────────────
  deploy-website:
    name: Deploy Website
    needs: [changes, build-desktop, upload-to-storage]
    if: |
      always() &&
      !failure() && !cancelled() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Resolve release info
        id: release
        run: |
          BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"

          # If upload-to-storage ran in this workflow, use its URL directly.
          if [[ "${{ needs.upload-to-storage.result }}" == "success" ]]; then
            VERSION="${{ needs.build-desktop.outputs.version }}"
            FILENAME="${{ needs.build-desktop.outputs.filename }}"
            DOWNLOAD_URL="${{ needs.upload-to-storage.outputs.download_url }}"
            echo "Using newly uploaded Firebase Storage URL: v${VERSION}"
          else
            # No new desktop build — find the latest version in the bucket.
            LATEST_VER=$(gsutil ls "gs://${BUCKET}/releases/" 2>/dev/null \
              | grep -oP 'v\d+\.\d+\.\d+' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | uniq | tail -1)

            if [[ -n "$LATEST_VER" ]]; then
              VERSION="${LATEST_VER#v}"
              FILENAME="DevTools-Installer-Setup-${VERSION}.exe"
              DOWNLOAD_URL="https://storage.googleapis.com/${BUCKET}/releases/${LATEST_VER}/${FILENAME}"
              echo "Using latest Firebase Storage version: ${LATEST_VER}"
            else
              VERSION="1.0.0"
              FILENAME="DevTools-Installer-Setup-${VERSION}.exe"
              DOWNLOAD_URL=""
              echo "No versions found in Storage — download URL will be empty"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "  Version:  ${VERSION}"
          echo "  URL:      ${DOWNLOAD_URL}"

      - name: Build website
        working-directory: webapp
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.version }}
          VITE_DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          VITE_INSTALLER_FILENAME: ${{ steps.release.outputs.filename }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
