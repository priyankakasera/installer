# ────────────────────────────────────────────────────────────────
# Build & Release — Windows Installer (.exe)
# ────────────────────────────────────────────────────────────────
# Triggers:
#   • Every push to main branch
#   • Every pull request targeting main
#   • Manual dispatch (workflow_dispatch)
#   • Tags matching v*.*.* → creates a GitHub Release
# ────────────────────────────────────────────────────────────────

name: Build Windows Installer

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"          # e.g. v1.0.0, v2.1.3
  pull_request:
    branches: [master]
  workflow_dispatch:       # allows manual trigger from GitHub UI

# ── Permissions for creating Releases ──────────────────────────
permissions:
  contents: write          # needed to create GitHub Releases

# ── Cancel in-progress runs for the same branch ───────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm           # caches ~/.npm based on package-lock.json

      # ── 3. Cache electron & electron-builder binaries ────────
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # ── 4. Install dependencies ──────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Generate placeholder icon if missing ──────────────
      #    (Your real project should commit a proper icon.ico to build/)
      - name: Ensure build/icon.ico exists
        shell: pwsh
        run: |
          if (-Not (Test-Path "build/icon.ico")) {
            Write-Host "⚠ No icon.ico found — generating a 256x256 placeholder"
            New-Item -ItemType Directory -Force -Path "build" | Out-Null

            # Use System.Drawing to create a proper 256x256 32bpp bitmap
            Add-Type -AssemblyName System.Drawing

            $size = 256
            $bmp = New-Object System.Drawing.Bitmap($size, $size)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)

            # Background: #4f8cff (matches app primary color)
            $bg = [System.Drawing.Color]::FromArgb(255, 79, 140, 255)
            $g.Clear($bg)

            # Draw "DT" text centered
            $font    = New-Object System.Drawing.Font("Arial", 80, [System.Drawing.FontStyle]::Bold)
            $brush   = [System.Drawing.Brushes]::White
            $measure = $g.MeasureString("DT", $font)
            $x = ($size - $measure.Width)  / 2
            $y = ($size - $measure.Height) / 2
            $g.DrawString("DT", $font, $brush, $x, $y)
            $g.Dispose()

            # Save bitmap as PNG into a MemoryStream
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            $pngBytes = $ms.ToArray()
            $ms.Dispose()

            # Build a valid ICO wrapping the PNG (Vista+ ICO format supports PNG)
            # ICO header: reserved(2) + type=1(2) + count=1(2)
            $icoHeader = [byte[]](0x00,0x00, 0x01,0x00, 0x01,0x00)
            # ICO directory entry (16 bytes): w=0(256), h=0(256), colorCount, reserved,
            #   planes, bitCount, dataSize(4LE), dataOffset(4LE)
            $dataSize   = $pngBytes.Length
            $dataOffset = 6 + 16  # header + one dir entry
            $icoDir = [byte[]](
              0x00, 0x00,   # width=0 (means 256), height=0 (means 256)
              0x00, 0x00,   # colorCount=0, reserved=0
              0x01, 0x00,   # planes=1
              0x20, 0x00,   # bitCount=32
              # dataSize (little-endian 4 bytes)
              ($dataSize -band 0xFF),
              (($dataSize -shr  8) -band 0xFF),
              (($dataSize -shr 16) -band 0xFF),
              (($dataSize -shr 24) -band 0xFF),
              # dataOffset (little-endian 4 bytes)
              ($dataOffset -band 0xFF),
              (($dataOffset -shr  8) -band 0xFF),
              (($dataOffset -shr 16) -band 0xFF),
              (($dataOffset -shr 24) -band 0xFF)
            )

            $icoBytes = $icoHeader + $icoDir + $pngBytes
            [System.IO.File]::WriteAllBytes(
              (Join-Path $PWD "build/icon.ico"),
              [byte[]]$icoBytes
            )
            Write-Host "✅ Placeholder icon.ico generated (256x256)"
          } else {
            Write-Host "✅ build/icon.ico already exists — skipping generation"
          }

      # ── 6. Build the Windows installer ───────────────────────
      #    On tag pushes:  build + publish to GitHub Releases (draft)
      #    Otherwise:       build only, no publish
      - name: Build Electron app (installer .exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Code Signing (uncomment when you have a cert) ────
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}           # base64-encoded .pfx
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            Write-Host "🏷 Tag detected — building + publishing to GitHub Releases"
            npm run build:publish
          } else {
            Write-Host "🔨 Building installer (no publish)"
            npm run build
          }

      # ── 7. Upload installer as artifact (always) ─────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevTools-Installer-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      # ── 8. Create GitHub Release (only on version tags) ──────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true           # manual review before publishing
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
