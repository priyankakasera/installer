<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c2925e"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Inner subtle ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <g clip-path="url(#circle)">
    <!-- Shoulders -->
    <ellipse cx="100" cy="225" rx="80" ry="60" fill="#1a2a2e"/>
    <!-- Collar detail -->
    <path d="M65,195 Q100,175 135,195" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="2"/>
    <!-- Neck -->
    <rect x="87" y="140" width="26" height="28" rx="6" fill="url(#skin)"/>
    <!-- Head -->
    <ellipse cx="100" cy="105" rx="40" ry="46" fill="url(#skin)"/>
    <!-- Hair - long flowing -->
    <path d="M55,100 Q52,60 100,52 Q148,60 145,100 Q143,80 135,70 Q120,58 100,56 Q80,58 65,70 Q57,80 55,100Z" fill="#1a1a2e"/>
    <!-- Long hair sides -->
    <path d="M55,100 Q50,130 55,160 Q58,145 62,130" fill="#1a1a2e"/>
    <path d="M145,100 Q150,130 145,160 Q142,145 138,130" fill="#1a1a2e"/>
    <!-- Hair flowing strands -->
    <path d="M57,110 Q52,135 56,155" fill="none" stroke="#252540" stroke-width="3" stroke-linecap="round"/>
    <path d="M143,110 Q148,135 144,155" fill="none" stroke="#252540" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="84" cy="102" rx="5.5" ry="5" fill="#1a1a2e"/>
    <ellipse cx="116" cy="102" rx="5.5" ry="5" fill="#1a1a2e"/>
    <!-- Eye highlights -->
    <circle cx="86" cy="100" r="2" fill="rgba(255,255,255,0.6)"/>
    <circle cx="118" cy="100" r="2" fill="rgba(255,255,255,0.6)"/>
    <!-- Eyelashes -->
    <path d="M78,97 Q84,94 90,97" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M110,97 Q116,94 122,97" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyebrows - slightly arched -->
    <path d="M75,91 Q84,86 92,90" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
    <path d="M108,90 Q116,86 125,91" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M100,106 Q97,116 100,118 Q103,116 100,118" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M87,126 Q100,135 113,126" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
    <!-- Subtle earring accents -->
    <circle cx="58" cy="115" r="2.5" fill="rgba(6,182,212,0.5)"/>
    <circle cx="142" cy="115" r="2.5" fill="rgba(6,182,212,0.5)"/>
  </g>
</svg>
