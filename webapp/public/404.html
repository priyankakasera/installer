<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect all 404s to the root index.html for SPA hash routing
      var path = window.location.pathname;
      var base = '/dev-tools-installer/';
      if (path !== base) {
        window.location.replace(base + '#' + path.replace(base, '/'));
      }
    </script>
  </head>
  <body></body>
</html>
