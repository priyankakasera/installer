<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 80">
  <!-- Background -->
  <rect width="128" height="80" rx="8" fill="#232F3E"/>
  <!-- "aws" wordmark -->
  <text x="64" y="40" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="34" fill="#FF9900" text-anchor="middle" dominant-baseline="central"
        letter-spacing="1">aws</text>
  <!-- Orange smile / swoosh arrow -->
